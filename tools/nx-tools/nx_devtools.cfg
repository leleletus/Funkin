# Switch port test options. Only read by test builds (compiled with -DNX_DEV_TOOLS);
# a release build ignores this file and has no botplay at all.
# deploy_switch.sh copies this file next to Funkin.nro on every deploy.

# R3 (right stick click) toggles botplay during a song.
botplay_toggle=true

# Songs start with botplay already on.
botplay_start=false

# Heap ceiling in MB for long-session memory tests (0 = no cap). Citron's heap is ~98 MB larger
# than the console's; 3110 emulates the console. Ignored when the heap is already smaller.
heap_cap_mb=0

# Single-copy PNG decode (INC-49). false = lime's stock decode (two full-size blocks per image), for A/B tests.
single_copy_decode=true

# Post-switch texture release largest first, with a full collection before a texture whose GPU buffer would extend
# the heap (INC-49). false = Build 25 order (hash order, dropped copies parked until a later GC), for A/B tests.
ordered_release=true

# Banded texture uploads (INC-49). false = OpenFL's single glTexImage2D (Mesa stages the whole image at once), for A/B tests.
banded_upload=true

# Runs started on the console by holding a button combo for 3 seconds (test builds only; empty or off = nothing).
# L+R: every Story week three times in a row with the memory budget per week (~30 min).
combo_lr=MEMORY_BUDGET_X3
# ZL+ZR: Weekend 1, Week 7, LE SSERAFIM and two Freeplay songs played to the end with botplay.
combo_zlzr=PLAYTHROUGH

# Audio thread priority (INC-54). high (what every build uses since Build 35) = SDL's audio thread at priority 0x2B on core 1,
# above the garbage collector threads (940 audio gaps -> 1 in the same long console session); default = as SDL creates it
# (0x3B), only for A/B tests.
audio_thread_priority=high

# Cutscenes (Step 3). ffmpeg = played from the official video files by NXVideoDecoder (720p, YUV shader, audio clock);
# sheets = the PNG sheets (also the fallback when a video cannot be opened).
video_backend=ffmpeg
# false = FFmpeg without NEON. Only for Citron, whose dynarmic lacks an instruction the HEVC decoder (2Hot) uses.
video_simd=true

# Song shortcuts (test builds, always on): hold only L for 3 s to skip the cutscene playing or end the song (Story
# mode goes on to the next song); hold only R for 3 s to load the song again from the start, cutscene included.
