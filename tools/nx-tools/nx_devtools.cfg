# Switch port test options. Only read by test builds (compiled with -DNX_DEV_TOOLS);
# a release build ignores this file and has no botplay at all.
# deploy_switch.sh copies this file next to Funkin.nro on every deploy.

# R3 (right stick click) toggles botplay during a song.
botplay_toggle=true

# Songs start with botplay already on.
botplay_start=false

# Heap ceiling in MB for long-session memory tests (0 = no cap). Citron's heap is ~98 MB larger
# than the console's; 3110 emulates the console. Ignored when the heap is already smaller.
heap_cap_mb=0

# Single-copy PNG decode (INC-49). false = lime's stock decode (two full-size blocks per image), for A/B tests.
single_copy_decode=true

# Post-switch texture release largest first, with a full collection before a texture whose GPU buffer would extend
# the heap (INC-49). false = Build 25 order (hash order, dropped copies parked until a later GC), for A/B tests.
ordered_release=true

# Banded texture uploads (INC-49). false = OpenFL's single glTexImage2D (Mesa stages the whole image at once), for A/B tests.
banded_upload=true
