# Switch port test options. Only read by test builds (compiled with -DNX_DEV_TOOLS);
# a release build ignores this file and has no botplay at all.
# deploy_switch.sh copies this file next to Funkin.nro on every deploy.

# R3 (right stick click) toggles botplay during a song.
botplay_toggle=true

# Songs start with botplay already on.
botplay_start=false
